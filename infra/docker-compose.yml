# Dev dependencies only — Postgres and Redis, published on the host so the npm
# scripts (`npm run dev:server`, `npm test`, `npm run stress`) can reach them.
# The one-command full stack lives in `docker-compose.full.yml`.
#
# The explicit project name is load-bearing: without it Compose derives the
# project (and therefore the `pgdata` volume) name from the directory holding
# this file, so the database was called `infra_pgdata` and every clone on the
# machine silently shared it. Naming the project makes the volume
# `flash-sale_pgdata` — same sharing, but visibly deliberate.
name: flash-sale

services:
  postgres:
    image: postgres:16-alpine
    container_name: flash-sale-postgres
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
      POSTGRES_DB: flash_sale
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash -d flash_sale"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: flash-sale-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata: